<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Sathyajith (Velmet) — student developer</title>
<desc id="heroDesc">Dark hero with name, tagline and terminal window</desc>
<defs>
<radialGradient id="wash" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }
.mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Menlo, monospace; }
.fade-line { opacity: 0; animation: rise 9s ease-in-out infinite; }
.r1 { animation-delay: 0.4s; } .r2 { animation-delay: 1.4s; } .r3 { animation-delay: 2.5s; } .r4 { animation-delay: 3.6s; } .r5 { animation-delay: 4.6s; }
@keyframes rise { 0% { opacity: 0; } 8% { opacity: 1; } 84% { opacity: 1; } 94%, 100% { opacity: 0.94; } }
.blink { animation: blink 1.15s steps(1) infinite; }
@keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
</style>
<!-- base -->
<rect x="8" y="8" width="1264" height="444" rx="24" fill="#0B0D12" stroke="#232838" stroke-width="1.2"/>
<ellipse cx="1050" cy="90" rx="300" ry="150" fill="url(#wash)"/>
<!-- LEFT -->
<g>
<text x="72" y="86" font-size="13" letter-spacing="3" fill="#8B8DA3" class="mono">OPEN TO REMOTE WORK · INDIA</text>
<text x="70" y="168" font-size="70" font-weight="800" fill="#F2F4F8" class="sans" letter-spacing="-1">Sathyajith</text>
<text x="72" y="212" font-size="30" font-weight="600" fill="#A78BFA" class="sans">(Velmet)</text>
<text x="72" y="252" font-size="19" fill="#B9C0D0" class="sans">Building useful software — from the web to the workbench.</text>
<text x="72" y="282" font-size="15" fill="#8B93A7" class="mono">student · india · remote only</text>
<text x="72" y="318" font-size="14" fill="#8B93A7" class="mono">open-source / web / ai-agents / robotics</text>
<line x1="72" y1="352" x2="300" y2="352" stroke="#232838" stroke-width="1.2"/>
<text x="72" y="378" font-size="13" fill="#5B6376" class="mono">apps · websites · llm tools · hardware · games</text>
</g>
<!-- TERMINAL -->
<g>
<rect x="700" y="56" width="508" height="348" rx="16" fill="#10131B" stroke="#262C3A" stroke-width="1.2"/>
<line x1="700" y1="106" x2="1208" y2="106" stroke="#1E2430" stroke-width="1"/>
<circle cx="728" cy="81" r="6" fill="#FF5F57"/>
<circle cx="748" cy="81" r="6" fill="#FEBC2E"/>
<circle cx="768" cy="81" r="6" fill="#28C840"/>
<text x="792" y="86" font-size="13" fill="#8B8DA3" class="mono">velmet@dev: ~</text>
<text x="1160" y="86" font-size="12.5" fill="#565B73" class="mono">zsh</text>
<g font-size="15" class="mono">
<g class="fade-line r1">
<text x="724" y="144" fill="#7DD3FC">$</text>
<text x="742" y="144" fill="#E8EAF2">whoami</text>
<text x="724" y="168" fill="#8B93A7">sathyajith (velmet) — student, india</text>
</g>
<g class="fade-line r2">
<text x="724" y="204" fill="#7DD3FC">$</text>
<text x="742" y="204" fill="#E8EAF2">focus --list</text>
<text x="724" y="228" fill="#8B93A7">apps · web · </text>
<text x="832" y="228" fill="#A78BFA">llm-agents</text>
<text x="928" y="228" fill="#8B93A7"> · robotics</text>
</g>
<g class="fade-line r3">
<text x="724" y="264" fill="#7DD3FC">$</text>
<text x="742" y="264" fill="#E8EAF2">stack --core</text>
<text x="724" y="288" fill="#C4B5FD">py · ts · js · react · html/css</text>
</g>
<g class="fade-line r4">
<text x="724" y="324" fill="#7DD3FC">$</text>
<text x="742" y="324" fill="#E8EAF2">learning --now</text>
<text x="724" y="348" fill="#8B93A7">rust (intermediate) · c# · godot</text>
</g>
<g class="fade-line r5">
<text x="724" y="384" fill="#34D399">✓</text>
<text x="742" y="384" fill="#E8EAF2">open_to_remote: </text>
<text x="892" y="384" fill="#34D399">true</text>
<rect x="936" y="372" width="9" height="17" fill="#A78BFA" class="blink"/>
</g>
</g>
</g>
</svg>
