<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" role="img" aria-label="gradient divider">
<defs>
<linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
<stop offset="20%" stop-color="#8B5CF6"/>
<stop offset="50%" stop-color="#6366F1"/>
<stop offset="80%" stop-color="#22D3EE"/>
<stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
.pulse-line { animation: op 3.5s ease-in-out infinite; }
@keyframes op { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
.dot { animation: move 3.5s linear infinite; }
@keyframes move { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(1020px); opacity: 0; } }
</style>
<rect x="140" y="11" width="1000" height="2" rx="1" fill="url(#d)" class="pulse-line"/>
<circle cx="150" cy="12" r="3.5" fill="#A78BFA" class="dot"/>
</svg>
